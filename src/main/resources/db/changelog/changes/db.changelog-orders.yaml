databaseChangeLog:
  - changeSet:
      id: create-order-table
      author: root
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyConstraintName: fk_user_order
                    referencedTableName: users
                    referencedColumnName: id
              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: total
                  type: decimal
                  constraints:
                    nullable: false
              - column:
                 name: order_date
                 type: DATETIME
                 constraints:
                   nullable: false
              - column:
                  name: shipping_address
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
  - changeSet:
      id: create-order_items-table
      author: root
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyConstraintName: fk_order_order_item
                    referencedTableName: orders
                    referencedColumnName: id
              - column:
                  name: book
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyConstraintName: fk_book_order_items
                    referencedTableName: books
                    referencedColumnName: id
              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: decimal
                  constraints:
                    nullable: false
