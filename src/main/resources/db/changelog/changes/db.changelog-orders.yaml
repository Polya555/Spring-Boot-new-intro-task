databaseChangeLog:
  - changeSet:
      id: create-order-table
      author: root
      changes:
        - createTable:
            tableName: shopping_carts
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
  - changeSet:
      id: create-order_items-table
      author: root
      changes:
        - createTable:
            tableName: cart_items
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: shopping_cart_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyConstraintName: fk_cart_item_shopping_cart
                    referencedTableName: shopping_carts
                    referencedColumnName: id
              - column:
                  name: book
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyConstraintName: fk_book_cart_items
                    referencedTableName: books
                    referencedColumnName: id
              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false
